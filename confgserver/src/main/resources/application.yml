spring:
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/shaikh-shahzade/Config-Repo.git"
          clone-on-start: true
          default-label: main
          force-pull: true
          timeout: 5

  rabbitmq:
      host: "localhost"
      port: 5672
      username: "guest"
      password: "guest"
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    